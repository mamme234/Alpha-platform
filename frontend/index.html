<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AlphaPlatform | The Future of Development</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <nav style="display: flex; justify-content: space-between; padding: 20px 80px; align-items: center; border-bottom: 1px solid var(--border);">
        <h2 style="letter-spacing: -1px; font-weight: 800;">ALPHA<span style="color: var(--accent);">PLATFORM</span></h2>
        <div style="display: flex; gap: 30px; align-items: center;">
            <a href="app-store.html" style="color: var(--text-dim); text-decoration: none;">App Store</a>
            <a href="workspace.html" class="btn-primary">Open Workspace</a>
        </div>
    </nav>

    <header style="text-align: center; padding: 120px 20px;">
        <span style="color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 2px;">Deploy in Seconds</span>
        <h1 style="font-size: 4rem; margin: 20px 0; background: linear-gradient(to right, #fff, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Build apps at the speed of thought.</h1>
        <p style="color: var(--text-dim); max-width: 600px; margin: 0 auto 40px auto; font-size: 1.2rem;">The all-in-one AI app generator, cloud IDE, and deployment engine for modern developers.</p>
        <div style="display: flex; gap: 20px; justify-content: center;">
            <button class="btn-primary" onclick="location.href='workspace.html'">Start Coding Free</button>
            <button style="background: transparent; border: 1px solid var(--border); color: white; padding: 10px 20px; border-radius: 6px;">Browse Apps</button>
        </div>
    </header>
</body>
</html>
